[pytest]
# Test discovery
testpaths = tests database/tests weather/tests calculator/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    unit: Unit tests (fast, mocked dependencies)
    e2e: End-to-end tests (slow, real connections)
    integration: Integration tests
    smoke: Smoke tests (critical functionality)
    slow: Slow tests

# Asyncio configuration
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    -p no:warnings

# Coverage configuration
[coverage:run]
source = database,weather,calculator
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
