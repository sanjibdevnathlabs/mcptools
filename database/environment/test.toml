# Database MCP Server - Test Environment Configuration
# Used during automated E2E testing

[database]
# Test database connection with environment variable defaults
# Local tests: Uses localhost with root/root and test_db
# Docker tests: Overridden by DB_* environment variables
host = "${DB_HOST:-localhost}"
port = "${DB_PORT:-3306}"
user = "${DB_USER:-root}"
password = "${DB_PASSWORD:-root}"
database = "${DB_DATABASE:-test_db}"
charset = "utf8mb4"

# Smaller pool for tests
pool_size = 2
pool_recycle = 600
query_timeout = 5

[server]
# All server settings use environment variables with defaults for safety
# E2E tests set these before running to test different protocols and ports
# Defaults: stdio mode on 127.0.0.1:8000
transport_mode = "${TRANSPORT_MODE:-stdio}"
host = "${FASTMCP_HOST:-127.0.0.1}"
port = "${FASTMCP_PORT:-8000}"

[logger]
# Minimal logging for tests
level = "ERROR"
destination = "file"

[mcp]
# Test mode: Allow all operations for comprehensive testing
readonly_mode = false
tool_mode = "${MCP_TOOL_MODE:-full}"  # Test all tools in "full" mode by default

# Allow all query types for integration tests
# Tests use isolated test_db database, so modifications are safe
allowed_query_types = "SELECT, INSERT, UPDATE, DELETE, SHOW, DESCRIBE, EXPLAIN, CREATE, DROP, ALTER"

[security]
# Enable security validation
enable_sql_analysis = true

# Smaller limits for tests
max_rows_returned = 100
max_query_length = 10240  # 10KB
