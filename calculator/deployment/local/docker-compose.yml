version: '3.8'

services:
  # SSE Transport on port 8080
  calculator-sse:
    build:
      context: ../../..
      dockerfile: calculator/docker/Dockerfile
      args:
        BASE_TAG: local-dev
    image: mcp-calculator:local-sse
    container_name: calculator-sse
    environment:
      # Use docker environment configuration
      - APP_ENV=docker
      - TRANSPORT_MODE=sse
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8080
      - LOG_LEVEL=DEBUG
    ports:
      - "8080:8080"
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8080)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # HTTP Transport on port 8081
  calculator-http:
    build:
      context: ../../..
      dockerfile: calculator/docker/Dockerfile
      args:
        BASE_TAG: local-dev
    image: mcp-calculator:local-http
    container_name: calculator-http
    environment:
      # Use docker environment configuration
      - APP_ENV=docker
      - TRANSPORT_MODE=streamable-http
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8081
      - LOG_LEVEL=DEBUG
    ports:
      - "8081:8081"
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8081)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Test service - Run quality checks and tests
  # Runs automatically with docker-compose up (exit code indicates success/failure)
  # Can also run explicitly: docker-compose run --rm calculator-test
  calculator-test:
    build:
      context: ../../..
      dockerfile: calculator/docker/Dockerfile.test
      args:
        BASE_TAG: local-dev
    image: mcp-calculator:test
    container_name: calculator-test
    environment:
      - APP_ENV=test
      - LOG_LEVEL=ERROR
    volumes:
      # Mount source for testing local changes
      - ../../../calculator:/app/calculator:ro
      - ../../../shared:/app/shared:ro
      - ../../../tests:/app/tests:ro
    working_dir: /app
    networks:
      - mcp-network
    restart: "no"  # Don't restart after tests complete

networks:
  mcp-network:
    driver: bridge
    name: mcp-local-network
