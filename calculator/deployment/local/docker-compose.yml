version: '3.8'

services:
  # SSE Transport on port 8080
  calculator-sse:
    build:
      context: ../../..
      dockerfile: calculator/docker/Dockerfile
      args:
        BASE_TAG: local-dev
    image: mcp-calculator:local
    container_name: calculator-sse
    environment:
      # Use docker environment configuration
      - APP_ENV=docker
      - TRANSPORT_MODE=sse
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8080
      - LOG_LEVEL=DEBUG
    ports:
      - "8080:8080"
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8080)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # HTTP Transport on port 8081
  calculator-http:
    build:
      context: ../../..
      dockerfile: calculator/docker/Dockerfile
      args:
        BASE_TAG: local-dev
    image: mcp-calculator:local
    container_name: calculator-http
    environment:
      # Use docker environment configuration
      - APP_ENV=docker
      - TRANSPORT_MODE=streamable-http
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8081
      - LOG_LEVEL=DEBUG
    ports:
      - "8081:8081"
    networks:
      - mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8081)); s.close()\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  mcp-network:
    driver: bridge
    name: mcp-local-network
