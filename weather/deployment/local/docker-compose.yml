services:
  weather-sse:
    build:
      context: ../../..
      dockerfile: weather/docker/Dockerfile
    image: mcp-weather:local-sse
    container_name: weather-sse
    environment:
      - APP_ENV=docker
      - TRANSPORT_MODE=sse
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8082
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=json
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8082)); s.close()\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  weather-http:
    build:
      context: ../../..
      dockerfile: weather/docker/Dockerfile
    image: mcp-weather:local-http
    container_name: weather-http
    environment:
      - APP_ENV=docker
      - TRANSPORT_MODE=streamable-http
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8083
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=json
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8083)); s.close()\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Test service - Run quality checks and tests
  # Runs automatically with docker-compose up (exit code indicates success/failure)
  # Can also run explicitly: docker-compose run --rm weather-test
  weather-test:
    build:
      context: ../../..
      dockerfile: weather/docker/Dockerfile.test
      args:
        BASE_TAG: local-dev
    image: mcp-weather:test
    container_name: weather-test
    environment:
      - APP_ENV=test
      - LOG_LEVEL=ERROR
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-test_api_key}
    volumes:
      # Mount source for testing local changes
      - ../../../weather:/app/weather:ro
      - ../../../shared:/app/shared:ro
      - ../../../tests:/app/tests:ro
    working_dir: /app
    restart: "no"  # Don't restart after tests complete

networks:
  mcp-network:
    driver: bridge
    name: mcp-local-network

