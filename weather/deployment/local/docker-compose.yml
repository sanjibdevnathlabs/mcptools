services:
  weather-sse:
    build:
      context: ../../..
      dockerfile: weather/docker/Dockerfile
    image: mcp-weather:local-sse
    container_name: weather-sse
    environment:
      - APP_ENV=docker
      - TRANSPORT_MODE=sse
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8082
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=json
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8082)); s.close()\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  weather-http:
    build:
      context: ../../..
      dockerfile: weather/docker/Dockerfile
    image: mcp-weather:local-http
    container_name: weather-http
    environment:
      - APP_ENV=docker
      - TRANSPORT_MODE=streamable-http
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8083
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=json
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8083)); s.close()\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

